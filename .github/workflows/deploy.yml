# Deploys CryoSync to Databricks Apps (target: prod) and starts/restarts it.
#
# Required GitHub repository secrets (Actions -> Settings -> Secrets):
#   DATABRICKS_HOST          - workspace URL, e.g. https://dbc-2a25661e-3f93.cloud.databricks.com
#   DATABRICKS_CLIENT_ID     - service principal application (client) ID
#   DATABRICKS_CLIENT_SECRET - service principal OAuth secret
#
# The service principal needs: permission to create/manage apps, and CAN_MANAGE
# on the bundle root path (see databricks.yml prod target).

name: Deploy to Databricks Apps

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-databricks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CryoSync app
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      # The web app is auto-deployed by Databricks Apps from Git. This workflow
      # only manages the analytics job, so skip it cleanly when the deployment
      # credentials have not been configured in the repository yet.
      - name: Check Databricks credentials
        id: creds
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_CLIENT_ID" ] || [ -z "$DATABRICKS_CLIENT_SECRET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Databricks secrets are missing. Skipping bundle validate/deploy. Add DATABRICKS_HOST, DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET under Settings -> Secrets and variables -> Actions to enable deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate bundle
        if: steps.creds.outputs.configured == 'true'
        run: databricks bundle validate --target prod

      - name: Deploy bundle
        if: steps.creds.outputs.configured == 'true'
        run: databricks bundle deploy --target prod

      # The CryoSync web app is deployed from Git via the Databricks Apps UI
      # (auto-deploy on push), not through this bundle, so there is no
      # `bundle run` step here. This workflow only deploys the analytics job.
